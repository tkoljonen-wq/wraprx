<!doctype html>
<html lang="fi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f1720" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>WrapRx</title>
    <script>
      // Asennuskehote talteen heti, ennen sovelluksen latautumista: Chrome laukaisee
      // sen vain kerran, ja Asenna-painike (App.tsx) käyttää tätä.
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('wraprx-installable'));
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      WrapRx laskee kaiken selaimessa, joten se tarvitsee JavaScriptin. Mitään ei
      lähetetä palvelimelle.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
