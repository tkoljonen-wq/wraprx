name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Portti: punainen testi ei päädy tuotantoon (suunnitelma §4).
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Asenna riippuvuudet
        run: npm ci

      - name: Tyyppitarkistus
        run: npm run typecheck

      - name: Testit (yksikkö, referenssi, ominaisuus, rajatesti)
        run: npm test

      - name: Build
        run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          # Versionäkyvyys: build upottaa version ja SHA:n (suunnitelma §4).
          VITE_GIT_SHA: ${{ github.sha }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
